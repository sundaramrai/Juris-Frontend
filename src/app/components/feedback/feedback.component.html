<!-- src/app/components/feedback/feedback.component.html -->
@if (successPopup) {
<div class="popup-overlay" (click)="closePopup($event)" (keydown.enter)="closePopup($event)">
  <div class="popup-card" (click)="$event.stopPropagation()" (keydown.enter)="closePopup($event)">
    <img
      src="https://media4.giphy.com/media/v1.Y2lkPTc5MGI3NjExYmUzemdla3U5emw5MHptbHdrajhvcGNieGRjNjhoajQ1NG9yYW0wNyZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/lwdArutvbQTeuBDEBZ/giphy.gif"
      alt="Success" class="img-fluid mx-auto d-block" width="100">
    <h3 class="fw-bold mt-3">Thank You!</h3>
    <p class="text-muted">Your feedback has been submitted successfully.</p>
  </div>
</div>
}

@else {
<div class="container d-flex justify-content-center align-items-center">
  <div class="card shadow-lg p-4 border-0 col-12 col-sm-10 col-md-8 col-lg-6 mx-auto">
    <div class="text-center">
      <h2 class="fw-bold text-primary">Feedback</h2>
      <p class="text-muted">Help us improve by sharing your thoughts</p>
    </div>

    <form [formGroup]="feedbackForm" (ngSubmit)="submitFeedback()">
      <div class="mb-3">
        <label for="satisfaction" class="form-label fw-bold">How satisfied are you?</label>
        <div class="d-flex gap-2">
          @for (rating of ratings; track $index) {
          <button type="button" class="btn"
            [ngClass]="rating <= feedbackForm.get('satisfaction')?.value ? 'btn-primary' : 'btn-outline-primary'"
            (click)="setSatisfaction(rating)">
            {{ rating }}
          </button>
          @if (rating !== ratings[ratings.length - 1]) {
          <span class="vr">
            <i class="bi bi-circle-fill" *ngFor="let _ of [1, 2, 3, 4, 5, 6]"></i>
          </span>
          }
          }
        </div>
      </div>

      <div class="mb-3">
        <label for="issues" class="form-label fw-bold">What issues did you face?</label>
        <textarea id="issues" class="form-control" rows="3" formControlName="issues"
          placeholder="Describe any problems you faced..."></textarea>
      </div>

      <div class="mb-3">
        <label for="improvements" class="form-label fw-bold">What can we improve?</label>
        <textarea id="improvements" class="form-control" rows="3" formControlName="improvements"
          placeholder="Share your suggestions..."></textarea>
      </div>

      <div class="d-grid">
        <button type="submit" class="btn btn-primary" [disabled]="feedbackForm.invalid || isSubmitting">
          @if (isSubmitting) {
          <span class="spinner-border spinner-border-sm"></span>
          }
          Submit Feedback
        </button>
      </div>
    </form>
  </div>
</div>
}
