<!-- src/app/app.component.html -->
<nav class="navbar navbar-expand-lg"
  [ngClass]="{'navbar-dark bg-primary': isDarkTheme, 'navbar-light bg-white': !isDarkTheme, 'shadow-sm': true, 'py-2': true}">
  <div class="container">
    <a class="navbar-brand d-flex align-items-center" (click)="onHome()">
      <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" [attr.fill]="isDarkTheme ? '#ffffff' : '#0d6efd'"
        class="me-2" viewBox="0 0 16 16">
        <path
          d="M12.17 9.53c2.307-2.592 3.278-4.684 3.641-6.218.21-.887.214-1.58.16-2.065a3.578 3.578 0 0 0-.108-.563 2.22 2.22 0 0 0-.078-.23V.453c-.073-.164-.168-.234-.352-.295a2.35 2.35 0 0 0-.16-.045 3.797 3.797 0 0 0-.57-.093c-.49-.044-1.19-.03-2.08.188-1.536.374-3.618 1.343-6.161 3.604l-2.4.238h-.006a2.552 2.552 0 0 0-1.524.734L.15 7.17a.512.512 0 0 0 .433.868l1.896-.271c.28-.04.592.013.955.132.232.076.437.16.655.248l.203.083c.196.816.66 1.58 1.275 2.195.613.614 1.376 1.08 2.191 1.277l.082.202c.089.218.173.424.249.657.118.363.172.676.132.956l-.271 1.9a.512.512 0 0 0 .867.433l2.382-2.386c.41-.41.668-.949.732-1.526l.24-2.408Zm.11-3.699c-.797.8-1.93.961-2.528.362-.598-.6-.436-1.733.361-2.532.798-.799 1.93-.96 2.528-.361.599.599.437 1.732-.36 2.531Z" />
        <path
          d="M5.205 10.787a7.632 7.632 0 0 0 1.804 1.352c-1.118 1.007-4.929 2.028-5.054 1.903-.126-.127.737-4.189 1.839-5.18.346.69.837 1.35 1.411 1.925Z" />
      </svg>
      <span class="fw-bold text-primary fs-4">Juris AI</span>
    </a>

    <ul class="navbar-nav ms-auto d-flex align-items-center flex-row">
      <li class="nav-item me-2">
        <button class="btn border-0 bg-transparent text-primary"
          [ngClass]="{'btn-outline-light': isDarkTheme, 'btn-outline-dark': !isDarkTheme}" (click)="toggleTheme()">
          @if (isDarkTheme) {
          <span matTooltip="Switch to light theme">
            <mat-icon class="d-flex align-items-center">light_mode</mat-icon>
          </span>
          } @else {
          <span matTooltip="Switch to dark theme">
            <mat-icon class="d-flex align-items-center">dark_mode</mat-icon>
          </span>
          }
        </button>
      </li>
      @if (isLoggedIn) {
      <li class="nav-item my-1 my-lg-0 mx-lg-3">
        <button mat-button [matMenuTriggerFor]="profileMenu"
          class="d-flex align-items-center border-0 rounded px-2 py-1"
          [ngClass]="isDarkTheme ? 'bg-primary text-white' : 'bg-white text-primary'" id="profileDropdown">
          <mat-icon class="me-2" [ngClass]="isDarkTheme ? 'text-white' : 'text-primary'">account_circle</mat-icon>
          <span class="fw-semibold">{{username}}</span>
          <mat-icon [ngClass]="isDarkTheme ? 'text-white' : 'text-primary'">arrow_drop_down</mat-icon>
        </button>
      </li>
      }
      <mat-menu #profileMenu="matMenu" xPosition="after" yPosition="below" class="profile-menu-panel">
        <button mat-menu-item (click)="onLogout()" class="d-flex align-items-center">
          <mat-icon class="me-2 text-danger">logout</mat-icon>
          <span class="text-danger">Logout</span>
        </button>
      </mat-menu>
      @if (!isLoggedIn && !isLoginOrRegisterPage() && isChatbotPage()) {
      <li class="nav-item my-1 my-lg-0 mx-lg-3">
        <button class="btn btn-primary" type="button" (click)="onLogin()">Login</button>
      </li>
      }
    </ul>
  </div>
</nav>

<router-outlet></router-outlet>
